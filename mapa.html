<style>
:root{--azul:#0a2e5c;--azul2:#124a8f;--teal:#12a5a5;--oro:#e0a80d;--rojo:#b3261e;--gris:#f3f5f8;--txt:#1b2430;--muted:#5b6775;--bg:#ffffff}
*{box-sizing:border-box}
body{margin:0;font-family:Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:var(--txt);background:var(--gris)}
header{background:linear-gradient(90deg,var(--azul),var(--azul2));color:#fff;padding:14px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header h1{font-size:1.25rem;margin:0;font-weight:700}
header .sub{font-size:.85rem;opacity:.9}
header a{color:#fff;opacity:.9;text-decoration:none;border:1px solid rgba(255,255,255,.5);padding:4px 10px;border-radius:6px;font-size:.8rem}
.wrap{display:grid;grid-template-columns:minmax(320px,1.3fr) minmax(300px,.9fr);gap:14px;padding:14px 18px;max-width:1500px;margin:0 auto}
@media(max-width:900px){.wrap{grid-template-columns:1fr}}
.card{background:#fff;border-radius:12px;box-shadow:0 2px 10px rgba(10,46,92,.08);padding:14px;min-width:0;overflow:hidden}
.wrap>*{min-width:0}
.controls label{display:flex;align-items:center;gap:4px;flex:1 1 260px;min-width:0}
.controls select{flex:1;min-width:0;max-width:100%}
body{overflow-x:hidden}
.card h2{font-size:1rem;margin:0 0 8px;color:var(--azul)}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
select,button,input{font:inherit;padding:6px 8px;border:1px solid #cfd6df;border-radius:8px;background:#fff}
button.tog{cursor:pointer}
button.tog.on{background:var(--azul);color:#fff;border-color:var(--azul)}
svg#mapa{width:100%;height:auto;display:block;background:#eaf0f7;border-radius:10px}
path.dist{stroke:#fff;stroke-width:1.2;cursor:pointer;transition:opacity .15s}
path.dist:hover{opacity:.85;stroke:var(--oro);stroke-width:2}
path.dist.sel{stroke:var(--rojo);stroke-width:2.5}
text.lbl{font-size:10px;font-weight:700;fill:#102a4c;pointer-events:none;paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}
text.lbl2{font-size:9px;fill:#102a4c;pointer-events:none;paint-order:stroke;stroke:#fff;stroke-width:3px}
circle.ccpp{fill:var(--teal);fill-opacity:.45;stroke:#0b6b6b;stroke-width:.5;cursor:pointer}
circle.loc{fill:var(--oro);fill-opacity:.85;stroke:#7a5a00;stroke-width:1;cursor:pointer}
.legend{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:.78rem;margin-top:6px}
.legend span.box{display:inline-block;width:18px;height:12px;border-radius:2px;margin-right:3px;vertical-align:middle}
#tip{position:fixed;pointer-events:none;background:#102a4c;color:#fff;padding:8px 10px;border-radius:8px;font-size:.8rem;max-width:300px;display:none;z-index:10;box-shadow:0 4px 14px rgba(0,0,0,.3);line-height:1.35}
table{width:100%;border-collapse:collapse;font-size:.8rem}
th,td{padding:5px 6px;border-bottom:1px solid #e6eaf0;text-align:left;vertical-align:top}
th{background:#f0f4f9;color:var(--azul);position:sticky;top:0;cursor:pointer}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--azul2);border-radius:4px;display:inline-block;vertical-align:middle}
.ficha dl{display:grid;grid-template-columns:1fr auto;gap:2px 10px;margin:0;font-size:.82rem}
.ficha dt{color:var(--muted)}
.ficha dd{margin:0;text-align:right;font-weight:600}
.ficha h3{margin:10px 0 4px;font-size:.85rem;color:var(--azul2);border-bottom:1px solid #e6eaf0}
.chip{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.72rem;font-weight:700;color:#fff;margin:1px}
.CRÍTICO{background:var(--rojo)} .ALTO{background:#e07b00} .MEDIO{background:var(--oro)} .BAJO{background:#2e8b57}
.tabs{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.tabs button{cursor:pointer}
.tabs button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.scroll{max-height:70vh;overflow:auto;border:1px solid #e6eaf0;border-radius:8px}
.tabwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.dcard{border:1px solid #e3e9f1;border-radius:12px;padding:10px 12px;margin:8px 4px;background:#fff;box-shadow:0 1px 6px rgba(10,46,92,.06);cursor:pointer}
.dcard .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.dcard .top b{color:var(--azul);font-size:1rem}
.dcard .top small{color:var(--muted)}
.dcard .brk{display:inline-block;min-width:44px;text-align:center;border-radius:8px;padding:2px 8px;font-weight:800;color:#fff;background:var(--azul2)}
.dcard .chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.dcard .chips span.lbl{font-size:.72rem;color:var(--muted);align-self:center}
.dcard .dem{font-size:.78rem;color:var(--muted);margin-top:6px;line-height:1.35}
footer{padding:14px 18px;font-size:.75rem;color:var(--muted);max-width:1500px;margin:0 auto;line-height:1.5}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:10px}
.kpi{background:linear-gradient(180deg,#fff,#f3f6fa);border:1px solid #e3e9f1;border-radius:10px;padding:8px 10px}
.kpi b{display:block;font-size:1.25rem;color:var(--azul)}
.kpi small{color:var(--muted)}
.src{font-size:.72rem;color:var(--muted);margin-top:6px}
@media(max-width:640px){header{padding:8px 12px;gap:6px}header h1{font-size:.98rem}header .sub{display:none}.kpis{grid-template-columns:repeat(2,1fr)}.kpi b{font-size:1.15rem}}
@media print{header a,.controls,.tabs{display:none}.wrap{display:block}.card{box-shadow:none;page-break-inside:avoid}}
</style>
</head>
